[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sort_ocd"
version = "2.0.0"
description = "AI-Powered professional file organizer CLI. Supports Ollama, OpenAI, Anthropic, and custom LLM backends."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "sort_OCD" },
]
keywords = [
    "file-organizer", "ai", "cli", "automation", "productivity",
    "ollama", "llm", "file-management", "organizer", "sorter"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "rich>=13.0",
    "questionary>=2.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
# Local AI (Ollama) + document reading
ai-local = [
    "ollama>=0.2",
    "PyPDF2>=3.0",
    "Pillow>=10.0",
]
# Cloud AI (OpenAI + Anthropic) + document reading
ai-cloud = [
    "openai>=1.0",
    "anthropic>=0.30",
    "PyPDF2>=3.0",
    "Pillow>=10.0",
]
# Everything
all = [
    "ollama>=0.2",
    "openai>=1.0",
    "anthropic>=0.30",
    "PyPDF2>=3.0",
    "Pillow>=10.0",
]

[project.scripts]
sort-ocd = "sort_ocd.cli:main"

[project.urls]
Homepage = "https://github.com/sort-ocd/sort_ocd"
Repository = "https://github.com/sort-ocd/sort_ocd"

[tool.setuptools.packages.find]
where = ["src"]
